<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Game" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background:#111; color:#eee; font-family:system-ui,Arial,sans-serif; margin:0; display:flex; flex-direction:column; align-items:center; }
    header { padding:0.5rem 1rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; }
    #canvas-wrapper { position:relative; line-height:0; }
    #cv { image-rendering:pixelated; background:#000; border:1px solid #222; }
    #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1rem; background:rgba(0,0,0,0.5); pointer-events:none; transition:opacity .4s; }
    .btn { background:#222; color:#ddd; border:1px solid #444; padding:0.4rem 0.8rem; cursor:pointer; font-size:0.85rem; border-radius:4px; }
    .btn:hover { background:#333; }
    footer { padding:0.75rem; font-size:0.7rem; opacity:0.7; }
  </style>
</head>
<body>
  <header>
    <button class="btn" id="fullscreenBtn" title="Toggle Fullscreen">Fullscreen</button>
    <span id="status">Loading assets…</span>
  </header>
  <div id="canvas-wrapper">
    <canvas id="cv" style="WIDTH:512px;HEIGHT:384px;" width="512" height="384" class="nrnb"></canvas>
    <div id="overlay">Loading…</div>
  </div>
  <script type="module" src="start.js"></script>
</body>
</html>
